services:
  - type: web
    name: collab-x
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && daphne -b 0.0.0.0 -p $PORT Collab_X.asgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: collab-x-db
          property: connectionString

databases:
  - name: collab-x-db
    region: oregon
    plan: free
